name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Install mobile plugin dependencies used by the root test suite
        run: npm ci --prefix mobile --ignore-scripts
      - run: bun run check

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install root lint configuration dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
