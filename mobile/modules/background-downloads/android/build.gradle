plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'xyz.streamarena.spotify'
version = '1.0.0'

android {
  namespace "expo.modules.backgrounddownloads"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
